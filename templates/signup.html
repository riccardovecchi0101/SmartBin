{% extends 'base.html' %}

{% block content %}
    <div class="box">
        <h1 class="title">Signup</h1>
        <form method="post" action="{{ url_for('signup', uuid=uuid) }}">
            <input type="hidden" name="uuid" value="{{ uuid }}">

            <div class="field">
                <label class="label">Nome</label>
                <div class="control">
                    <input class="input" type="text" name="name" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Cognome</label>
                <div class="control">
                    <input class="input" type="text" name="surname" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Username</label>
                <div class="control">
                    <input class="input" type="text" name="username" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Password</label>
                <div class="control">
                    <input class="input" type="password" name="password" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Provincia</label>
                <div class="control">
                  <div class="select">
                    <select id="provincia" name="provincia" required>
                      <option value="">Seleziona una provincia</option>
                    </select>
                  </div>
                </div>
              </div>
              
              <div class="field">
                <label class="label">Città</label>
                <div class="control">
                  <div class="select">
                    <select id="citta" name="citta" required>
                      <option value="">Seleziona una città</option>
                    </select>
                  </div>
                </div>
              </div>
              

            <button class="button is-primary">Registrati</button>
        </form>
    </div>

    <script>
        fetch("{{ url_for('static', filename='data/comuni.json') }}")
          .then(res => res.json())
          .then(data => {
            const province = [...new Set(data.map(c => c.provincia))]; // province uniche
            const provSelect = document.getElementById("provincia");
            const citySelect = document.getElementById("citta");
        
            // Popola province
            province.forEach(p => {
              const opt = document.createElement("option");
              opt.value = p;
              opt.textContent = p;
              provSelect.appendChild(opt);
            });
        
            // Al cambio provincia → popola città
            provSelect.addEventListener("change", () => {
              const prov = provSelect.value;
              citySelect.innerHTML = '<option value="">Seleziona una città</option>';
              data.filter(c => c.provincia === prov).forEach(c => {
                const opt = document.createElement("option");
                opt.value = c.nome;
                opt.textContent = c.nome;
                citySelect.appendChild(opt);
              });
            });
          });
        </script>
        
{% endblock %}
