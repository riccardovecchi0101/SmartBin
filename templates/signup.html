{% extends 'base.html' %}

{% block content %}
    <h1 class="title">Sign Up</h1>
    <form method="post">
        <div class="field">
            <label class="label">Nome</label>
            <div class="control">
                <input class="input" type="text" name="name" required>
            </div>
            <label class="label mt-4">Cognome</label>
            <div class="control">
                <input class="input" type="text" name="surname" required>
            </div>
            <label class="label mt-4">Scegli il tuo username</label>
            <div class="control">
                <input class="input" type="text" name="username" required>
            </div>
            <label class="label mt-4">Scegli la tua password</label>
            <div class="control">
                <input class="input" type="text" name="password" required>
            </div>
        </div>
        <button class="button is-primary">Sign Up</button>
    </form>
{% endblock %}
